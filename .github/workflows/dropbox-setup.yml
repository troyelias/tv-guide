name: Dropbox setup (one time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Exchange the one-time code for a long-lived key (saved encrypted)
        env:
          DBX_KEY: ${{ secrets.DBX_KEY }}
          DBX_SECRET: ${{ secrets.DBX_SECRET }}
          DBX_CODE: ${{ secrets.DBX_CODE }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, urllib.parse, urllib.request, base64
          key, secret, code = (os.environ[k].strip() for k in ("DBX_KEY", "DBX_SECRET", "DBX_CODE"))
          if not (key and secret and code):
              sys.exit("Missing DBX_KEY / DBX_SECRET / DBX_CODE secret.")
          data = urllib.parse.urlencode({"code": code, "grant_type": "authorization_code"}).encode()
          req = urllib.request.Request("https://api.dropboxapi.com/oauth2/token", data=data)
          req.add_header("Authorization", "Basic " + base64.b64encode(f"{key}:{secret}".encode()).decode())
          try:
              tok = json.load(urllib.request.urlopen(req, timeout=60))
          except urllib.error.HTTPError as e:
              sys.exit(f"Dropbox refused the code (HTTP {e.code}). Codes expire quickly - get a new one and run again.")
          if "refresh_token" not in tok:
              sys.exit("No long-lived key returned - check the authorize link included token_access_type=offline.")
          os.makedirs("secure", exist_ok=True)
          enc = subprocess.run(["openssl", "enc", "-aes-256-cbc", "-pbkdf2", "-iter", "200000", "-salt",
                                "-pass", "env:DBX_SECRET"], input=tok["refresh_token"].encode(),
                               capture_output=True, check=True).stdout
          open("secure/dropbox.enc", "wb").write(enc)
          print("Dropbox connected.")
          PY

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add secure/dropbox.enc && git commit -qm "Dropbox connected" && git push
