name: Account status

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check subscription (saved encrypted)
        env:
          PROVIDER_XMLTV_URL: ${{ secrets.PRO }}
        run: python3 scripts/account.py "$RUNNER_TEMP/acct"

      - name: Save to the 'guide' branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q --depth 1 origin guide
          git worktree add -q g FETCH_HEAD
          cp "$RUNNER_TEMP/acct/status.enc" g/
          cd g && git add status.enc && git commit -qm "Status check" && git push -q origin HEAD:guide
