name: Outage watch

# Every hour: checks that the main service still logs in (no channel is played).
# If it fails on two checks at least 40 minutes apart, every channel is switched to the backup service.
# An outside task may also start this check each hour (at :17), so it keeps working when GitHub's timer is late.
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: tv-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRO: ${{ secrets.PRO }}
      PRO_2: ${{ secrets.PRO_2 }}
      DBX_KEY: ${{ secrets.DBX_KEY }}
      DBX_SECRET: ${{ secrets.DBX_SECRET }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      DBX_PATH: ${{ secrets.DBX_PATH }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check the main service's login
        id: w
        run: |
          git fetch -q origin watch 2>/dev/null && git show FETCH_HEAD:watch.json > "$RUNNER_TEMP/watch.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/watch.json"
          # 22:00-01:45 UTC (3:30-7:15 AM India) the morning check-up is running and handles an outage itself
          hm=$(date -u +%H%M)
          if [ "$hm" -ge 2200 ] || [ "$hm" -lt 145 ]; then echo "Check-up time - leaving it to the check-up"; echo "action=none" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "action=$(python3 scripts/outage_watch.py "$RUNNER_TEMP/watch.json")" >> "$GITHUB_OUTPUT"

      - name: Switch everything to the backup service
        if: steps.w.outputs.action == 'switch'
        run: |
          # never at the same moment as the check-up or an undo (both change the same memory): try again next hour
          # (the early start of the check-up waits for hours first; only its testing part counts as busy)
          busy=0
          for st in in_progress queued; do busy=$(( busy + $(gh run list --workflow playlist-undo.yml --status "$st" --json databaseId -q 'length') )); done
          for id in $(gh run list --workflow nightly.yml --status in_progress --json databaseId -q '.[].databaseId'); do
            gh run view "$id" --json jobs -q '.jobs[] | select(.name == "channels") | .status' | grep -q in_progress && busy=$(( busy + 1 ))
          done
          if [ "$busy" -gt 0 ]; then
            echo "The check-up or an undo is running - switching at the next check instead"
            python3 -c "import json,sys; p=sys.argv[1]; w=json.load(open(p)); w['switched']=False; json.dump(w,open(p,'w'))" "$RUNNER_TEMP/watch.json"
            exit 0
          fi
          python3 scripts/channels.py outage "$RUNNER_TEMP/ch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add secure && git commit -qm "Outage switch $(date -u +'%Y-%m-%d %H:%M') UTC" && git pull -q --rebase origin main && git push -q
          if ! python3 -c "import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get('uploaded') else 1)" "$RUNNER_TEMP/ch/channels.json"; then
            echo "::warning::Switch held back: $(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('upload_blocked','not uploaded'))" "$RUNNER_TEMP/ch/channels.json")"
            exit 0
          fi
          gh issue list --state open --author "app/github-actions" --search "Main service down - using backup in:title" --json number -q '.[].number' | grep -q . || \
            gh issue create --title "Main service down - using backup" --assignee "$GITHUB_REPOSITORY_OWNER" \
              --body "The main service stopped logging in twice in a row, so every channel was switched to the backup service. It switches back automatically during the 4-7 AM (India) check-up once the main service works again."

      - name: Check that the morning check-up is still running
        run: |
          # judged by the last real check-up (the guide is refreshed at midday too, so its age alone can hide a miss)
          last=$(curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/guide/channels.json" | python3 -c "import json,sys; print(json.load(sys.stdin).get('checkup_utc',''))" 2>/dev/null)
          [ -n "$last" ] || exit 0
          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 3600 ))
          title="Guide or check-up has stopped running"
          open=$(gh issue list --state open --author "app/github-actions" --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ "$age" -gt 28 ]; then
            [ -n "$open" ] || gh issue create --title "$title" --assignee "$GITHUB_REPOSITORY_OWNER" \
              --body "The last morning check-up was $age hours ago (normally about 24). Your TV keeps playing the last channel list. The next one runs at about 4 AM India time; if this stays open after that, ask Claude to look into it."
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Running again - closing."
          fi

      - name: Remember the result
        run: |
          mkdir w && cp "$RUNNER_TEMP/watch.json" w/ && cd w
          git init -q -b watch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "watch" && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" watch
