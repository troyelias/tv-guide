name: Self-test

# Runs whenever the repo's scripts, channel list or workflows change: rehearses the morning check-up
# (several pretend mornings), the guide merge, the dead-channel filler check, the outage rule and alerts,
# all on made-up data. A failure here means a change broke something - the real check-up also runs this first
# and changes nothing if it fails.
on:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "catalog.json", "channel-ids.txt", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install picture checker
        run: command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
      - name: Run the self-test
        env:
          STATE_KEY: ci-placeholder-not-a-secret   # the morning job carries real keys; the rehearsal must ignore them
        run: python3 tests/selftest.py
