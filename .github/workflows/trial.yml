name: Try a new service

# Before buying a service: reads its channel list, finds which of our channels it has, test-plays them
# (same picture-and-sound check as the nightly check-up), and tests extra Indian/Pakistani/UK-Asian channels.
# Contacts only the new service (TRIAL secret). Never touches the main or backup service, the playlist or the guide;
# it reads the setup's own memory only to compare against what the current services played.
# Results are locked so only the owner's key can open them.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install picture checker
        run: command -v ffmpeg || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null; }
      - name: Read the lineup and test-play channels (one at a time)
        env:
          TRIAL: ${{ secrets.TRIAL }}
          STATE_KEY: ${{ secrets.STATE_KEY }}   # only to read the current services' recent results for comparison
          DBX_SECRET: ${{ secrets.DBX_SECRET }}
        run: python3 scripts/trial.py "$RUNNER_TEMP/trial.json"
      - name: Lock and save the results to the 'trial' branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP"
          [ -s trial.json ] || exit 0
          openssl rand -hex 32 > k
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:k -in trial.json -out trial.enc
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/checks/probe.pub" -in k -out key.enc
          rm k
          mkdir out && cp trial.enc key.enc out/ && cd out
          git init -q -b trial
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Trial $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" trial
