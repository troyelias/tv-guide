name: Midday guide refresh

# About 1:00 PM India time. Refreshes programme listings only: no contact with either TV service,
# no change to the playlist.
on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tv-guide
  cancel-in-progress: false

jobs:
  grab:
    uses: ./.github/workflows/grab-listings.yml

  guide:
    needs: grab
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: listings
          path: ${{ runner.temp }}

      - name: Download fallback guides and the current guide
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o tataplay.xml.gz https://raw.githubusercontent.com/mitthu786/tvepg/main/tataplay/epg.xml.gz || true
          curl -fsSL --retry 3 -o combined.xml.gz https://raw.githubusercontent.com/mitthu786/tvepg/main/epg.xml.gz || true
          curl -fsSL --retry 3 -o previous.xml.gz "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/guide/guide.xml.gz" || true
          for r in IN4 UK1 PK1 AU1; do curl -fsSL --retry 2 --max-time 300 -o "es_$r.xml.gz" "https://epgshare01.online/epgshare01/epg_ripper_$r.xml.gz" || echo "shared guide $r failed"; done
          mkdir -p ch && curl -fsSL -o ch/channels.json "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/guide/channels.json" || echo '{}' > ch/channels.json

      - name: Merge (the current guide fills anything the free sources lack)
        run: |
          R="$RUNNER_TEMP"
          python3 scripts/merge.py channel-ids.txt "$R/guide.xml.gz" REPORT.md "$R/stats.json" \
            --previous="$R/previous.xml.gz" --map=extra-guides.json --notes="$R/ch/channels.json" \
            "Main=$R/main.xml" "Backup=$R/backup.xml" \
            "mitthu786 Tata Play=$R/tataplay.xml.gz" "mitthu786 Combined=$R/combined.xml.gz" \
            "Current guide=$R/previous.xml.gz" \
            "Shared India=$R/es_IN4.xml.gz#epgshare" "Shared UK=$R/es_UK1.xml.gz#epgshare" \
            "Shared Pakistan=$R/es_PK1.xml.gz#epgshare" "Shared Australia=$R/es_AU1.xml.gz#epgshare"
          mkdir -p "$R/site"
          git fetch -q origin spot 2>/dev/null && git show FETCH_HEAD:spot.json > "$R/spot.json" 2>/dev/null || echo '{}' > "$R/spot.json"
          python3 scripts/status_page.py "$R/site/index.html" "$R/stats.json" "$R/ch/channels.json" "$R/spot.json" history/guide-coverage.json

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRO: ${{ secrets.PRO }}
          PRO_2: ${{ secrets.PRO_2 }}
          DBX_KEY: ${{ secrets.DBX_KEY }}
          DBX_SECRET: ${{ secrets.DBX_SECRET }}
          DBX_PATH: ${{ secrets.DBX_PATH }}
        run: |
          R="$RUNNER_TEMP"
          mkdir out out/logs
          cp "$R/guide.xml.gz" REPORT.md "$R/site/index.html" "$R/ch/channels.json" out/
          cp "$R"/grab-*.log out/logs/ 2>/dev/null || true
          # leak check: nothing public may contain a login, server address or private location
          python3 scripts/leakcheck.py --fix out "$R/site" REPORT.md logos history
          cd out
          git init -q -b guide
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Guide $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" guide
          cd .. && cp "$R/grabber.lock" grabber.lock 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in REPORT.md grabber.lock history; do if [ -e "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -qm "Report $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull -q --rebase origin main && git push -q

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/site

      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true
