name: Close look at channels

# Opens a few channels on both services for ~15 seconds each and reports whether real picture comes through.
# Changes nothing on the TV. Skips a service if someone is watching on it (unless "force" is ticked).
on:
  workflow_dispatch:
    inputs:
      names:
        description: "Channel names, comma-separated (leave empty to only check both accounts, e.g. after a renewal)"
        required: false
        default: ""
      logos:
        description: "Also compare on-screen logos between the listed channels (calibration)"
        type: boolean
        default: false
      delay:
        description: "Also measure which service runs ahead (records both at once, ~1 min per channel)"
        type: boolean
        default: false
      all_copies:
        description: "Look at every copy (up to 4) of each channel, not just the first - e.g. to find which copy has no picture"
        type: boolean
        default: false
      force:
        description: "Look even if someone is watching (may interrupt them)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install picture tools
        timeout-minutes: 12
        run: scripts/install_ffmpeg.sh
      - name: Look at each channel
        env:
          PRO: ${{ secrets.PRO }}
          PRO_2: ${{ secrets.PRO_2 }}
          NAMES: ${{ inputs.names }}
          FORCE: ${{ inputs.force && '1' || '0' }}
          LOGOS: ${{ inputs.logos && '1' || '0' }}
          DELAY: ${{ inputs.delay && '1' || '0' }}
          ALL_COPIES: ${{ inputs.all_copies && '1' || '0' }}
          SHOTS_DIR: ${{ runner.temp }}/shots
        run: |
          mkdir -p "$SHOTS_DIR"
          python3 scripts/probe.py "$RUNNER_TEMP/probe.txt"
      - name: Lock the sample pictures (only the owner's key can open them)
        if: always()
        run: |
          cd "$RUNNER_TEMP"
          [ -d shots ] && [ -n "$(ls shots)" ] || exit 0
          tar czf shots.tgz shots
          openssl rand -hex 32 > k
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:k -in shots.tgz -out shots.enc
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/checks/probe.pub" -in k -out key.enc
          rm k shots.tgz
      - name: Save results to the 'probe' branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRO: ${{ secrets.PRO }}
          PRO_2: ${{ secrets.PRO_2 }}
        run: |
          [ -f "$RUNNER_TEMP/probe.txt" ] || exit 0
          python3 scripts/leakcheck.py "$RUNNER_TEMP/probe.txt"
          mkdir out && cp "$RUNNER_TEMP/probe.txt" out/ && { cp "$RUNNER_TEMP"/shots.enc "$RUNNER_TEMP"/key.enc out/ 2>/dev/null || true; } && cd out
          git init -q -b probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Probe $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" probe
