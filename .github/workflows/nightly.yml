name: Nightly check-up

# Runs at about 4:05 AM India time. Tests channels on both services, switches broken ones,
# updates the playlist in Dropbox, rebuilds the guide, status page and alerts.
on:
  schedule:
    - cron: "37 15 * * *"   # early start (9:07 PM India time) and a second one at 11:07 PM: both wait for the 4 AM
    - cron: "37 17 * * *"   # window. GitHub's timers for this repo have fired up to 7 hours late, so start early
    - cron: "35 22 * * *"   # 4:05 AM India time
    - cron: "20 23 * * *"   # 4:50 AM India time - backup start, only acts if the first was skipped
  # An outside daily task also presses "Run workflow" at 4:06 AM. Whichever start comes first does the
  # check-up; every later start sees it already ran and stops.
  workflow_dispatch:
    inputs:
      mode:
        description: "preview = no testing, nothing changed (safe any time). nightly = full check-up (only acts 4:00-6:30 AM India time)."
        type: choice
        default: preview
        options: [preview, nightly]
      force:
        description: "Run the full check-up even if tonight's already ran (normally leave unticked)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: tv
  cancel-in-progress: false

jobs:
  wait:
    # Only the early starts wait (in two parts: GitHub allows at most 6 hours per job); other starts go straight on.
    if: github.event_name == 'schedule' && (github.event.schedule == '37 15 * * *' || github.event.schedule == '37 17 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Wait (part 1) for the 4 AM (India time) window
        run: |
          now=$(date -u +%s); target=$(date -u -d "today 22:32" +%s); h=$(date -u +%H)
          if [ "$h" -ge 12 ] && [ "$now" -lt "$target" ]; then
            secs=$(( target - now )); [ "$secs" -gt 19800 ] && secs=19800   # at most 5.5 hours in this part
            echo "Waiting $(( secs / 60 )) minutes"; sleep "$secs"
          fi

  wait2:
    needs: wait
    if: github.event_name == 'schedule' && (github.event.schedule == '37 15 * * *' || github.event.schedule == '37 17 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Wait (part 2) for the 4 AM (India time) window
        run: |
          now=$(date -u +%s); target=$(date -u -d "today 22:32" +%s); h=$(date -u +%H)
          if [ "$h" -ge 12 ] && [ "$now" -lt "$target" ]; then
            echo "Waiting $(( (target - now) / 60 )) more minutes until 4:02 AM India time"; sleep $(( target - now ))
          fi

  channels:
    needs: [wait, wait2]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 175   # includes the wait for the 5:45 AM second try
    env:
      PRO: ${{ secrets.PRO }}
      PRO_2: ${{ secrets.PRO_2 }}
      DBX_KEY: ${{ secrets.DBX_KEY }}
      DBX_SECRET: ${{ secrets.DBX_SECRET }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      DBX_PATH: ${{ secrets.DBX_PATH }}
      MODE: ${{ inputs.mode || 'nightly' }}
      BACKUP_SLOT: ${{ inputs.force != true && '1' || '0' }}   # any start skips if tonight's check-up already ran, unless forced
    outputs:
      skip: ${{ steps.run.outputs.skip }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main   # latest saved memory, even if this run waited in the queue

      - name: Install picture checker (spots "dead channel" black filler)
        continue-on-error: true
        timeout-minutes: 12
        run: scripts/install_ffmpeg.sh

      - name: Self-test (rehearses the check-up on made-up services; if it fails, nothing is changed tonight)
        run: python3 tests/selftest.py

      - name: Test channels, switch broken ones, update playlist
        id: run
        run: |
          git fetch -q origin spot 2>/dev/null && git show FETCH_HEAD:spot.json > "$RUNNER_TEMP/spot.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/spot.json"
          SPOT_FILE="$RUNNER_TEMP/spot.json" python3 scripts/channels.py "$MODE" "$RUNNER_TEMP/ch"
          [ -f "$RUNNER_TEMP/ch/skip" ] && echo "skip=1" >> "$GITHUB_OUTPUT" || true

      - name: Save switch-over memory (encrypted)
        if: env.MODE == 'nightly'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add secure 2>/dev/null || true
          git diff --cached --quiet || { git commit -qm "Check-up $(date -u +'%Y-%m-%d %H:%M') UTC"; git pull -q --rebase origin main; git push -q; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: channels
          path: ${{ runner.temp }}/ch/

  grab:
    needs: channels
    if: ${{ !cancelled() && needs.channels.outputs.skip != '1' }}
    uses: ./.github/workflows/grab-listings.yml

  guide:
    needs: [channels, grab]
    if: ${{ !cancelled() && needs.channels.outputs.skip != '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: listings
          path: ${{ runner.temp }}

      - name: Download fallback guides, previous guide and both services' own guides
        env:
          PRO: ${{ secrets.PRO }}
          PRO_2: ${{ secrets.PRO_2 }}
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o tataplay.xml.gz https://raw.githubusercontent.com/mitthu786/tvepg/main/tataplay/epg.xml.gz || echo "fallback 1 failed"
          curl -fsSL --retry 3 -o combined.xml.gz https://raw.githubusercontent.com/mitthu786/tvepg/main/epg.xml.gz || echo "fallback 2 failed"
          curl -fsSL --retry 3 -o previous.xml.gz "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/guide/guide.xml.gz" || echo "no previous guide"
          for r in IN4 UK1 PK1 AU1; do curl -fsSL --retry 2 --max-time 300 -o "es_$r.xml.gz" "https://epgshare01.online/epgshare01/epg_ripper_$r.xml.gz" || echo "shared guide $r failed"; done
          python3 "$GITHUB_WORKSPACE/scripts/provider_guides.py" . | tee provider-guides.txt
          ls -la

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: channels
          path: ${{ runner.temp }}/ch

      - name: Merge into one guide
        run: |
          R="$RUNNER_TEMP"
          python3 scripts/merge.py channel-ids.txt "$R/guide.xml.gz" REPORT.md "$R/stats.json" \
            --previous="$R/previous.xml.gz" --map="$R/ch/provmap.json" --map=extra-guides.json --notes="$R/ch/channels.json" \
            "Main=$R/main.xml" "Backup=$R/backup.xml" \
            "mitthu786 Tata Play=$R/tataplay.xml.gz" "mitthu786 Combined=$R/combined.xml.gz" \
            "Service 1=$R/svc1.xml#main" "Service 2=$R/svc2.xml#backup" \
            "Shared India=$R/es_IN4.xml.gz#epgshare" "Shared UK=$R/es_UK1.xml.gz#epgshare" \
            "Shared Pakistan=$R/es_PK1.xml.gz#epgshare" "Shared Australia=$R/es_AU1.xml.gz#epgshare"

      - name: Copy any new logos into the repo
        run: python3 scripts/logos.py

      - name: Status page and alerts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKUP_RESULT: ${{ needs.channels.result }}
          MODE: ${{ inputs.mode || 'nightly' }}
        run: |
          R="$RUNNER_TEMP"; mkdir -p "$R/site"
          # keep the last real check-up's results if this run has none
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if 'channels' in d else 1)" "$R/ch/channels.json" 2>/dev/null \
            || curl -fsSL -o "$R/ch/channels.json" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/guide/channels.json" || echo '{}' > "$R/ch/channels.json"
          git fetch -q origin spot 2>/dev/null && git show FETCH_HEAD:spot.json > "$R/spot.json" 2>/dev/null || echo '{}' > "$R/spot.json"
          python3 scripts/status_page.py "$R/site/index.html" "$R/stats.json" "$R/ch/channels.json" "$R/spot.json" history/guide-coverage.json
          # alerts follow real check-ups only (a preview has no test results and would close alerts wrongly)
          if [ "$MODE" = "nightly" ] || [ "$CHECKUP_RESULT" != "success" ]; then
            python3 scripts/alerts.py "$R/stats.json" "$R/ch/channels.json" "$R/spot.json"
          fi

      - name: Publish guide to the 'guide' branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRO: ${{ secrets.PRO }}
          PRO_2: ${{ secrets.PRO_2 }}
          DBX_KEY: ${{ secrets.DBX_KEY }}
          DBX_SECRET: ${{ secrets.DBX_SECRET }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          DBX_PATH: ${{ secrets.DBX_PATH }}
        run: |
          R="$RUNNER_TEMP"
          mkdir out out/logs
          cp "$R/guide.xml.gz" REPORT.md "$R/site/index.html" "$R/ch/channels.json" out/
          cp "$R/ch/review.enc" out/ 2>/dev/null || true
          cp "$R"/grab-*.log out/logs/ 2>/dev/null || true
          (cd "$R" && ls -la *.xml *.gz 2>/dev/null | awk '{print $5, $9}') > out/logs/downloads.txt
          cp "$R/provider-guides.txt" out/logs/ 2>/dev/null || true
          # leak check: nothing public may contain a login, server address or private location
          python3 scripts/leakcheck.py --fix out "$R/site" REPORT.md logos history
          cd out
          git init -q -b guide
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Guide $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" guide

      - name: Save report, logos and grabber version on main
        run: |
          cp "$RUNNER_TEMP/grabber.lock" grabber.lock 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in REPORT.md grabber.lock logos history; do if [ -e "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -qm "Report $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull -q --rebase origin main && git push -q

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/site

      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true
