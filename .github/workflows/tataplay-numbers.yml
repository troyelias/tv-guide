name: Tata Play channel numbers

# Monthly: download Tata Play's public channel list (names and channel numbers - no logins involved) so the
# playlist can number channels exactly like a Tata Play set-top box. Saved as tataplay-numbers.json on main.
on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: "Link to Tata Play's latest 'Channel List' PDF (leave empty for the one last used)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download Tata Play's official channel list (PDF with set-top box numbers)
        run: |
          set +e
          URL="${{ inputs.pdf_url }}"
          [ -n "$URL" ] || URL="https://www.tataplay.com/cms-assets/compliances/files/2026-07/Channel%20List-21072026.pdf"
          curl -fsSL --retry 2 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/146 Safari/537.36" -o /tmp/list.pdf "$URL"
          echo "download exit $? size $(stat -c %s /tmp/list.pdf 2>/dev/null)" > /tmp/tp-debug.txt
          mkdir -p tp && cp /tmp/list.pdf tp/channel-list.pdf 2>/dev/null
      - name: Keep the details for checking
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir d && cp /tmp/tp-debug.txt d/ 2>/dev/null; cp tp/channel-list.pdf d/ 2>/dev/null; cd d && git init -q -b tp-debug
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm debug && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tp-debug
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f tataplay-numbers.json ] || exit 0
          git add tataplay-numbers.json && (git diff --cached --quiet || git commit -qm "Tata Play channel numbers $(date -u +%Y-%m-%d)")
          git pull -q --rebase origin main && git push -q
