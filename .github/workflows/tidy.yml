name: Tidy old branches
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          for b in checks probe trial; do git push -q origin --delete "$b" 2>/dev/null && echo "removed $b" || echo "no $b"; done
